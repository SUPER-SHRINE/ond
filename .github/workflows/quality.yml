name: 品質検査

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Rust 1.91.1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust 1.91.1を準備
        shell: pwsh
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy

      - name: Full品質検査
        shell: pwsh
        run: pwsh -NoProfile -File tools/quality.ps1 -Profile Full

      - name: リリースsmoke test
        shell: pwsh
        run: pwsh -NoProfile -File tools/release-smoke.ps1 -Profile Release

      - name: 実配布archiveの文書収録を検証
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-release-package.ps1

      - name: Windows installerを作成して検証
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is required on the Windows runner.' }
          pwsh -NoProfile -File tools/build-installer.ps1 -Version $version -Compiler $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          pwsh -NoProfile -File tools/test-installer.ps1 -Version $version -RunIntegration
          if ($LASTEXITCODE -ne 0) { throw 'Installer integration failed.' }
