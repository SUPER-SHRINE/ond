[project.theme]
language = "ja"
custom_dir = "overrides"
font = false
logo = "assets/ond_logo.png"
favicon = "assets/ond_logo.png"
features = ["navigation.tabs", "navigation.sections", "navigation.indexes"]

[project.validation]
invalid_links = true
# Zensical 0.0.73's anchor validator misses Unicode and several valid slugs;
# generated HTML is checked by tools/check-docs-links.py instead.
invalid_link_anchors = false

[project.markdown_extensions]
ond_markdown = {}
ond_highlight = {}
tables = {}
pymdownx.superfences = {}
pymdownx.escapeall = { hardbreak = true }
pymdownx.tilde = {}
toc = { slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } } }
