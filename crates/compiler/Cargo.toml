[package]
name = "ond-compiler"
description = "Ond compiler backend and linker for Kagura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[lib]
name = "ond_compiler"
path = "src/lib.rs"

[dependencies]
ond-protocol = { path = "../protocol" }
ond-compiler-core = { path = "../compiler-core" }

[dev-dependencies]
debug-io = { package = "kagura-debug-io", git = "https://github.com/SUPER-SHRINE/kagura", tag = "0.1.0" }
ond-compiler-core = { path = "../compiler-core", features = ["conformance-fixtures"] }
ram = { package = "kagura-ram", git = "https://github.com/SUPER-SHRINE/kagura", tag = "0.1.0" }
kagura = { git = "https://github.com/SUPER-SHRINE/kagura", tag = "0.1.0" }
