[package]
name = "ond-cli"
description = "Ond compiler and linker command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[[bin]]
name = "ond"
path = "src/main.rs"

[dependencies]
ond-compiler = { path = "../compiler" }
ond-compiler-core = { path = "../compiler-core" }
ond-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
